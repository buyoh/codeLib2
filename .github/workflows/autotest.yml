name: autotest

on:
  push:
    branches:
    - master
    - develop
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.2"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: install tools
        run: |
          sudo apt update
          sudo apt install g++ clang clang-format
      - name: prepare codeLib2-tools
        run: |
          pushd tools/codeLib2-tools
          cargo build --release --bins
          popd > /dev/null
      # - name: test
      #   run: |
      #     ruby tools/buildtest.rb -j 2
      # - name: autotest
      #   run: |
      #     ruby tools/autotest.rb -j 2
      - name: test codeLib2-tools
        run: |
          (cd tools/codeLib2-tools && cargo test)
          ruby tools/codeLib2-tools/tools/test/run.rb
      - name: run autotest
        run: |
          bash .github/workflows/autotest_run.sh
      - name: summary
        if: always()
        run: |
          if [ -f /tmp/autotest.md ]; then cat /tmp/autotest.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: check autotest result
        run: |
          # exit with 1 if failed
          ruby tools/codeLib2-tools/tools/dump_result_to_markdown.rb \
            --result-path /tmp/autotest.json \
            --check-test-fail > /dev/null
name: update-htmldoc

# yarn upgrade
# Upgrade yarn.lock
# cf. yarn upgrade --latest
#
# bundle update
# Upgrade Gemfile.lock

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: htmldoc

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: master
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: tools/codeLib2-htmldoc/package.json
          cache: false  # No package exists here
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.2"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Please tell me who you are.
        run: |
          git config --global user.email "53999520+mai-w@users.noreply.github.com"
          git config --global user.name "mai bot-worker"
      - name: prepare codeLib2-tools
        run: |
          (cd tools/codeLib2-tools && cargo build --release --bins)
          cp -ar .github/workflows /tmp/
      - name: generate by codeLib2-htmldoc
        run: |
          bash ./.github/workflows/htmldoc_gen.sh
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: doc
      - name: commit phase
        run: |
          # scripts in the doc branch may be obsoleted
          bash /tmp/workflows/htmldoc_commit.sh
      - uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: doc
